[project]
name = "pagerank-lab"
version = "0.1.0"
description = "PageRank by Monte Carlo random-surfer sampling vs iterative fixed-point calculation, with reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",       # rankdata: tie-aware (average) ranks for Spearman
    "matplotlib>=3.9",   # benchmark charts
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagerank_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
